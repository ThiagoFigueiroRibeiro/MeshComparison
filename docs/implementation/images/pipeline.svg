<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img"><style>
:root{--bg:#f7f9fb;--ink:#27384c;--sub:#344b60;--mute:#536a82;--box:#ffffff;--hl:#dfe9f4;--line:#7089a5;--arrow:#56708c;--gt:#356487;--rm:#c87856;--gtfill:#aac2d7;--node:#537a9a;--guide:#9ab0c1;--link:#69727d}
