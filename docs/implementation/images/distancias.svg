<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img"><style>
:root{--bg:#f7f9fb;--ink:#27384c;--sub:#344b60;--mute:#536a82;--box:#ffffff;--hl:#dfe9f4;--line:#7089a5;--arrow:#56708c;--gt:#356487;--rm:#c87856;--gtfill:#aac2d7;--node:#537a9a;--guide:#9ab0c1;--link:#69727d}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--sub:#c3d0dc;--mute:#9fb1c3;--box:#161b22;--hl:#1f3550;--line:#5f7f9f;--arrow:#8aa4bd;--gt:#6fb0dc;--rm:#e59a78;--gtfill:#2a4259;--node:#6fa3c9;--guide:#4a6178;--link:#8b96a3}}
.bg{fill:var(--bg)}.t{font-family:Arial,sans-serif}.ink{fill:var(--ink)}.sub{fill:var(--sub)}.mute{fill:var(--mute)}
.box{fill:var(--box);stroke:var(--line);stroke-width:2}.hl{fill:var(--hl);stroke:var(--line);stroke-width:2}
.arr{stroke:var(--arrow);stroke-width:2;fill:none}.arrf{fill:var(--arrow)}
.gts{stroke:var(--gt);fill:none}.rms{stroke:var(--rm);fill:none}.gtf{fill:var(--gt)}.rmf{fill:var(--rm)}
</style><rect class="bg" width="100%" height="100%"/><g class="t"><text class="ink" x="28" y="34" font-size="23" font-weight="bold">Distâncias ao vértice mais próximo</text>
<path class="gts" stroke-width="4" d="M80 246L185 110L285 215L380 114L470 235"/><path class="rms" stroke-width="4" d="M98 273L215 153L315 242L404 162L490 274"/>
<g class="gtf"><circle cx="80" cy="246" r="7"/><circle cx="185" cy="110" r="7"/><circle cx="285" cy="215" r="7"/><circle cx="380" cy="114" r="7"/><circle cx="470" cy="235" r="7"/></g>
<g class="rmf"><circle cx="98" cy="273" r="7"/><circle cx="215" cy="153" r="7"/><circle cx="315" cy="242" r="7"/><circle cx="404" cy="162" r="7"/><circle cx="490" cy="274" r="7"/></g>
<path d="M185 110 L215 153 M380 114 L404 162 M315 242 L285 215" stroke="var(--link)" stroke-width="2" stroke-dasharray="5 5"/>
<text class="gtf" x="565" y="115" font-size="20">● GT: referência</text><text class="rmf" x="565" y="156" font-size="20">● RM: reconstrução</text>
<text class="sub" x="565" y="206" font-size="16">Chamfer: média das distâncias</text><text class="sub" x="565" y="238" font-size="16">Hausdorff: maior distância</text><text class="sub" x="565" y="270" font-size="16">RMSE: penaliza erros grandes</text></g></svg>
