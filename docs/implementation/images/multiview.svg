.bg{fill:var(--bg)}.t{font-family:Arial,sans-serif}.ink{fill:var(--ink)}.sub{fill:var(--sub)}.mute{fill:var(--mute)}
.box{fill:var(--box);stroke:var(--line);stroke-width:2}.hl{fill:var(--hl);stroke:var(--line);stroke-width:2}
.arr{stroke:var(--arrow);stroke-width:2;fill:none}.arrf{fill:var(--arrow)}
