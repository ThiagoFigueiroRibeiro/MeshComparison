<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura modular do Mesh Comparison</title>
  <desc id="desc">A interface monta a configuração, o runner inicia um worker em processo filho, e o worker chama um dos dois pipelines. Os pipelines compartilham o preparo de malhas e produzem resultados na pasta escolhida.</desc>
  <style>
    :root { color-scheme: light dark; --text:#27384c; --muted:#536a82; --card:#ffffff; --accent:#dfe9f4; --line:#7089a5; --arrow:#56708c; }
    @media (prefers-color-scheme: dark) { :root { --text:#e6edf3; --muted:#9fb1c3; --card:#161b22; --accent:#1f3550; --line:#5f7f9f; --arrow:#8aa4bd; } }
    text { font-family: Arial, sans-serif; fill: var(--text); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--line); stroke-width:2; }
    .accent { fill: var(--accent); stroke: var(--line); stroke-width:2; }
    .arrow { fill:none; stroke:var(--arrow); stroke-width:2.5; marker-end:url(#arrowhead); }
  </style>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--arrow)"/></marker></defs>
  <text x="600" y="34" text-anchor="middle" font-size="24" font-weight="bold">Arquitetura modular</text>

  <rect class="card" x="20" y="65" width="245" height="105" rx="12"/>
  <text x="142" y="98" text-anchor="middle" font-size="18" font-weight="bold">Interface desktop</text>
  <text class="muted" x="142" y="125" text-anchor="middle" font-size="14">app.py · main_window.py · panels.py</text>
  <text class="muted" x="142" y="147" text-anchor="middle" font-size="13">seleção e configuração</text>

  <path class="arrow" d="M265 117H310"/>
  <rect class="accent" x="315" y="65" width="235" height="105" rx="12"/>
  <text x="432" y="98" text-anchor="middle" font-size="18" font-weight="bold">Supervisão</text>
  <text class="muted" x="432" y="125" text-anchor="middle" font-size="14">config.py · runner.py</text>
  <text class="muted" x="432" y="147" text-anchor="middle" font-size="13">QProcess · fila · cancelar</text>

  <path class="arrow" d="M550 117H595"/>
  <rect class="accent" x="600" y="65" width="235" height="105" rx="12"/>
  <text x="717" y="98" text-anchor="middle" font-size="18" font-weight="bold">Processo filho</text>
  <text class="muted" x="717" y="125" text-anchor="middle" font-size="14">gui/worker.py</text>
  <text class="muted" x="717" y="147" text-anchor="middle" font-size="13">recebe RunConfig em JSON</text>

  <path class="arrow" d="M835 117H880"/>
  <rect class="card" x="885" y="65" width="295" height="105" rx="12"/>
  <text x="1032" y="98" text-anchor="middle" font-size="18" font-weight="bold">Pipeline selecionado</text>
  <text class="muted" x="1032" y="125" text-anchor="middle" font-size="14">geometry.pipeline.run_pipeline</text>
  <text class="muted" x="1032" y="147" text-anchor="middle" font-size="14">ou perceptual.pipeline.run_pipeline</text>

  <path class="arrow" d="M1032 170V200H197V222"/>
  <path class="arrow" d="M1032 170V195H650V222"/>
  <rect class="accent" x="475" y="225" width="350" height="96" rx="12"/>
  <text x="650" y="258" text-anchor="middle" font-size="18" font-weight="bold">Preparo compartilhado</text>
  <text class="muted" x="650" y="284" text-anchor="middle" font-size="14">common/prepare.py · carregar · normalizar · MSE · ICP</text>
  <text class="muted" x="650" y="304" text-anchor="middle" font-size="13">exportar a RM alinhada na escala original</text>

  <rect class="card" x="20" y="225" width="355" height="96" rx="12"/>
  <text x="197" y="258" text-anchor="middle" font-size="18" font-weight="bold">Resultados</text>
  <text class="muted" x="197" y="284" text-anchor="middle" font-size="14">CSV · PLY · PNG na pasta selecionada</text>
  <text class="muted" x="197" y="304" text-anchor="middle" font-size="13">visualizados por outputs.py e ResultsView</text>

  <path class="arrow" d="M825 274H920"/>
  <rect class="card" x="925" y="225" width="255" height="96" rx="12"/>
  <text x="1052" y="258" text-anchor="middle" font-size="18" font-weight="bold">Módulos comuns</text>
  <text class="muted" x="1052" y="284" text-anchor="middle" font-size="14">io · alignment · rendering</text>
  <text class="muted" x="1052" y="304" text-anchor="middle" font-size="14">transforms · device</text>

  <text class="muted" x="600" y="365" text-anchor="middle" font-size="14">Cada pipeline selecionado roda em um processo filho; ao selecionar os dois, a execução é sequencial.</text>
</svg>
