    @media (prefers-color-scheme: dark) {
      text[fill="#13233b"], text[fill="#20324b"] { fill: #edf2fa !important; }
      text[fill="#52627a"], text[fill="#6a778a"], text[fill="#34445c"] { fill: #afbdd0 !important; }
      text[fill="#155b91"] { fill: #9bd2ff !important; }
      text[fill="#654294"] { fill: #dbc2ff !important; }
      rect[fill="#ffffff"] { fill: #192332 !important; stroke: #394a60 !important; }
      rect[fill="#e4f1fb"] { fill: #1d3b56 !important; }
      rect[fill="#f0eafb"] { fill: #392c4d !important; }
      line[stroke="#c4cfdd"] { stroke: #516077 !important; }
      circle[fill="#1769aa"] { fill: #62baff !important; }
      circle[fill="#7651a8"] { fill: #c49aff !important; }
