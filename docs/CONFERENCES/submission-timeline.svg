<svg xmlns="http://www.w3.org/2000/svg" width="1323.92" height="1312.588" viewBox="38.54 14.894 1323.92 1312.588" role="img" aria-labelledby="title desc">
  <title id="title">Calendário de submissões e conferências, 2026–2027</title>
  <desc id="desc">Prazos de submissão da IJCNN 2027, datas das conferências IJCNN e IV 2027 e lembrete provisório para acompanhamento em fevereiro de 2027 sobre a submissão da IV, sem data oficial anunciada.</desc>
  <style>
