<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330"><style>:root{color-scheme:light dark;--bg:#f7f9fb;--card:#ffffff;--text:#27384c;--muted:#536a82;--gt:#356487;--rm:#b96545;--line:#7089a5;--accent:#dfe9f4}@media(prefers-color-scheme:dark){:root{--bg:#161d27;--card:#222d3b;--text:#edf2f8;--muted:#bdccdd;--gt:#7fbce6;--rm:#f3a080;--line:#91a8c1;--accent:#30465e}}</style><rect width="860" height="330" fill="var(--bg)"/><g font-family="Arial,sans-serif"><text x="26" y="33" font-size="23" font-weight="bold" fill="var(--text)">Avaliação perceptual: renderizações com câmera compartilhada</text><ellipse cx="315" cy="176" rx="213" ry="95" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 7"/><path d="M266 214L300 101L354 214Z" fill="var(--accent)" stroke="var(--gt)" stroke-width="3"/><circle cx="102" cy="176" r="17" fill="var(--gt)"/><circle cx="315" cy="81" r="17" fill="var(--gt)"/><circle cx="528" cy="176" r="17" fill="var(--gt)"/><circle cx="315" cy="271" r="17" fill="var(--gt)"/><path d="M560 176H625" stroke="var(--line)" stroke-width="3" marker-end="url(#arrow)"/><rect x="641" y="99" width="184" height="158" rx="14" fill="var(--card)" stroke="var(--line)"/><text x="659" y="135" fill="var(--text)" font-size="17">Por vista:</text><text x="659" y="171" fill="var(--text)" font-size="18">LPIPS</text><text x="659" y="200" fill="var(--text)" font-size="18">PSNR</text><text x="659" y="229" fill="var(--text)" font-size="18">SSIM</text><text x="42" y="308" fill="var(--muted)" font-size="15">100 azimutes por padrão, elevação constante; os arquivos PNG são salvos só nas vistas selecionadas.</text></g><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="var(--line)"/></marker></defs></svg>